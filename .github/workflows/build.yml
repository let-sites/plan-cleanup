name: Build installers

# Mac minutes cost 10x and Windows 2x on private repos, so installers are only
# built when the version number changes (or when started by hand).
on:
  push:
    branches: [main]
    paths: ['planclean/__init__.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: python -m pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: PlanCleanup-Windows
          - os: macos-15-intel   # arm64 Macs were unavailable on GitHub; Intel build runs on any Mac
            name: PlanCleanup-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm plancleanup.spec
      - name: Check the packaged app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PlanCleanup/PlanCleanup.exe -ArgumentList '--selftest', "$PWD/selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Check the packaged app starts (Mac)
        if: runner.os == 'macOS'
        run: |
          dist/PlanCleanup.app/Contents/MacOS/PlanCleanup --selftest "$PWD/selftest.txt"
          cat selftest.txt
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/PlanCleanup -DestinationPath ${{ matrix.name }}.zip
      - name: Disk image (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg && cp -R dist/PlanCleanup.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Plan Cleanup" -srcfolder dmg -ov -format UDZO ${{ matrix.name }}.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 1
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import planclean; print(planclean.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Plan Cleanup ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: ${{ matrix.name }}.*
